                                    "In my opinion, Stalin's government created an environment where fear became part of people's everyday life. I think it is disturbing that families were afraid of their own government simply because they didn't know what might happen to them.",
                                    "I think that people were very scared of the police. They were so affraied that a fire looked normal and slower than being arrested by the secret police. That swoed that people were affraied all the time of the secret police "
                                ]
                            },
                            {
                                cite: "", // Título, autor y fecha de la fuente 2.
                                image: "", // Imagen propia de la fuente 2.
                                text: "It became vastly more difficult to socialise because nobody knew who was informing them… in the morning when you left your flat, you saw that a flat had been sealed and that those people were no longer there. Of course, your state of mind was utter terror, because nobody knew whether they would be arrested… People turned in on themselves. My son had woken up, and I said, ‘Little son, get up and go to your granny – I’m going away for a while.’... Then I went to the little girl – she was four years old, he was six. She was sleeping with her nose in the pillow. I turned round and she started smiling. What could I do? I kissed her and left.",
                                analyses: [
                                    "In my opinion, Stalin destroyed people's personal lives because his government made everyone suspicious of each other. People had to think carefully about what they said and who they trusted. This also affected children and families.",
                                    "Also, in this source, we can see that Stalin was a disaster for the Soviet Union because people lived in constant fear. They couldn't trust anyone and were afraid of being arrested. Families were also separated, which made life very difficult for everyone. ",
                                    "For me, this shows how terrible life was because people couldn't even trust their neighbours or feel safe in their own homes. It must have been really hard to leave your family without knowing if you would ever come back. ",
                                    "I think that when the country was under Stalin’s regime, society got severely damaged by creating an environment where people couldn't trust each other. I think it was especially cruel that fear affected family relationships and forced people to be separated from their loved ones, especially children being separated from their parents.",
                                    " In my opinion, this is terrible because people could not trust their own neighbors. When they looked outside, they saw that the apartments next to them were sealed and that nobody lived there anymore. This made people live in constant fear."
                                ]
                            },
                            {
                                cite: "", // Título, autor y fecha de la fuente 3.
                                image: "", // Imagen propia de la fuente 3.
                                text: "Trotsky and his contemptible friends… organised in the USSR gangs of murderers, wreckers and spies. They caused train collisions in the USSR, blew up and set fire to mines and factories, wrecked machines and poisoned workers, and did all the damage they possibly could. These enemies of the people had a definite programme, which was to restore the yoke of the capitalists and landlords to the USSR, to destroy the collective farms… and to promote the defeat of the USSR in the event of war.",
                                analyses: [
                                    "I think Stalin used accusations against Trotsky and his supporters to make them look like enemies of the country. This could help Stalin get rid of political opponents and keep his power. In my opinion, he used propaganda to justify his actions.",
                                    " In my opinion, based on this source, Stalin was a disaster for the Soviet Union because his government accused people who disagreed with him of being enemies. This created fear and made it dangerous to have a different opinion. It also shows how much control Stalin had over the country.",
                                    "In my opinion, this text shows how Stalin tried to make Trotsky look like a bad person by accusing him of destroying factories, hurting workers and working against the USSR. ",
                                    "In this source it is shown that Stalin used accusations as a political weapon and turned people against his political opponents. I think this was a way of manipulating public opinion, especially because the source only presents his side of the story.",
                                    "In my opinion, this is terrible because Trotsky and his followers were accused of destroying factories, trains and machines, and hurting workers. I think these accusations were very serious, but we cannot know if they were true just by reading this source."
                                ]
                            }
                        ]
                    }
                ],
                obituary: {
                    image: "img/stalin.jpg", // Retrato que aparece en el frente del obituary de Stalin.
                    text: "Joseph Stalin was born in 1878 in Georgia. After Lenin's death, he slowly gained power and became the leader of the Soviet Union. He introduced Five-Year Plans to develop industry and forced farmers to join collective farms. Under his rule, the USSR became a major industrial and military power. However, Stalin also used terror, secret police and mass arrests to control the population. Many people were sent to labour camps or executed during the purges. He ruled the Soviet Union until his death in 1953."   // Texto que aparece al dar vuelta el obituary de Stalin.
                },
                verdict: "" // Conclusión de Stalin.
            }
        ];

        // 3) Datos generales de los obituaries (nombres y fechas).
        const OBITUARY_NAMES = {
            lenin: ["Vladimir Ilyich Lenin", "1870–1924"],
            stalin: ["Joseph Vissarionovich Stalin", "1878–1953"]
        };

        /* ===== FIN DE LA ZONA DE EDICIÓN ===== */

        // Muestra una imagen si se completó su URL. Si no, deja un espacio de imagen.
        const ph = (image, hint, height) => image
            ? `<figure><img src="${image}" alt="${hint}"></figure>`
            : `<div class="ph"${height ? ` style="min-height:${height}px"` : ""}><div><b>Image here</b>${hint}</div></div>`;

        document.getElementById("names").innerHTML = MEMBERS.map((m, i) =>
            `<span class="chip" style="animation-delay:${.5 + i * .12}s">${m}</span>`
        ).join("");
        document.getElementById("fnames").textContent = MEMBERS.join(" · ");

        const sd = document.getElementById("star");
        for (let i = 0; i < 14; i++) {
            const layer = document.createElement("i");
            layer.style.transform = `translateZ(${(i - 7) * 5}px)`;
            layer.style.background = i === 13 ? "#e0a82e" : i === 0 ? "#8e0d16" : `hsl(355 80% ${32 + i * 1.6}%)`;
            sd.appendChild(layer);
        }

        // Cada fuente toma su imagen, texto, cita y análisis de su propio objeto.
        const renderSource = (source, personId, sectionIndex, sourceIndex) => {
            const analyses = source.analyses || [];
            return `
                <div class="src tilt" data-a="up">
                    <p class="cite">Source ${sourceIndex + 1}: ${source.cite || ""}</p>
                    <p class="${source.text ? "" : "ghost"}">${source.text || "Write the text for this source here."}</p>
                    <div class="tabs">
                        ${MEMBERS.map((member, index) =>
                `<button class="${index === 0 ? "on" : ""}" data-k="${index}">${member.split(" ")[0]}</button>`
            ).join("")}
                    </div>
                    <div class="pan">
                        <em>${MEMBERS[0]}</em>
                        ${analyses[0] || "<span class='ghost'>[Write this person's analysis here.]</span>"}
                    </div>
                </div>`;
        };

        document.getElementById("parts").innerHTML = PARTS.map(person =>
            `<section id="${person.id}" data-p="${person.id}">
                <div class="band" data-a="left">
                    <h2>${person.title}</h2>
                </div>
                ${person.sections.map((section, sectionIndex) =>
                `<h3 data-a="right"><i>${sectionIndex + 1}</i>${section.title}</h3>
                    ${ph(section.image, `image for ${section.title}`)}
                    ${(section.sources || []).map((source, sourceIndex) =>
                    renderSource(source, person.id, sectionIndex, sourceIndex)
                ).join("")}`
            ).join("")}
            </section>`
        ).join("");

        document.getElementById("obits").innerHTML = PARTS.map((person, index) => {
            const name = OBITUARY_NAMES[person.id];

            return `
        <div class="flip" data-p="${person.id}" data-a="${index ? "right" : "left"}"
            style="--d:${index * 0.25}s"
            tabindex="0"
            role="button"
            aria-label="Flip ${name[0]} obituary">

            <div class="inner">
                <div class="f">
                    <div class="tag" style="color:var(--gold)">Obituary · ${name[1]}</div>
                    ${ph(person.obituary.image, `portrait of ${name[0]}`)}
                    <h3>${name[0]}</h3>
                    <span class="sans">Click to read</span>
                </div>

                <div class="b">
                    <h3>${name[0]}</h3>
                    <p>${person.obituary.text || "Write this obituary here."}</p>
                </div>
            </div>
        </div>`;
        }).join("");

        document.addEventListener("click", e => {
            const b = e.target.closest(".tabs button");
            if (b) {
                const sourceCard = b.closest(".src");
                const allButtons = [...sourceCard.querySelectorAll(".tabs button")];
                const selectedIndex = allButtons.indexOf(b);
                const cardIndex = [...document.querySelectorAll(".src")].indexOf(sourceCard);
                const allSources = PARTS.flatMap(person => person.sections.flatMap(section => section.sources || []));
                const analysis = allSources[cardIndex]?.analyses?.[selectedIndex] || "<span class='ghost'>[Write this person's analysis here.]</span>";
                allButtons.forEach(button => button.classList.remove("on"));
                b.classList.add("on");
                const panel = sourceCard.querySelector(".pan");
                panel.style.animation = "none";
                panel.offsetWidth;
                panel.style.animation = "";
                panel.innerHTML = `<em>${MEMBERS[selectedIndex]}</em>${analysis}`;
                return;
            }
            const f = e.target.closest(".flip");

            if (f) {
                f.classList.toggle("on");
            }
        });
        document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("flip")) { e.preventDefault(); e.target.classList.toggle("on") } });
        if (!matchMedia("(prefers-reduced-motion:reduce)").matches) {
            document.querySelectorAll(".tilt").forEach(c => {
                c.addEventListener("mousemove", e => { const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; c.style.transform = `perspective(900px) rotateY(${x * 5}deg) rotateX(${-y * 5}deg) translateZ(6px)` });
                c.addEventListener("mouseleave", () => c.style.transform = "")
            });
        }
        const io = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add("in");

                    setTimeout(() => {
                        entry.target.classList.add("done");
                    }, 1300);

                    io.unobserve(entry.target);
                }
            });
        }, {
            threshold: 0.1
        });

        document.querySelectorAll("[data-a]").forEach(element => {
            io.observe(element);
        });
        const links = [...document.querySelectorAll("nav a")];

        addEventListener("scroll", () => {
            const h = document.documentElement;
            const bar = document.getElementById("bar");

            if (bar && h.scrollHeight > h.clientHeight) {
                bar.style.width =
                    h.scrollTop / (h.scrollHeight - h.clientHeight) * 100 + "%";
            }

            let cur = links[0];

            links.forEach(a => {
                const t = document.querySelector(a.getAttribute("href"));
                if (t && t.getBoundingClientRect().top < 140) cur = a;
            });

            links.forEach(a => a.classList.toggle("on", a === cur));
        }, { passive: true });
        document.addEventListener("click", function (event) {
            const link = event.target.closest('a[href^="#"]');

            if (!link) return;

            const id = link.getAttribute("href");
            const target = document.querySelector(id);

            if (!target) return;

            event.preventDefault();

            const position = target.getBoundingClientRect().top + window.scrollY - 75;

            window.scrollTo({
                top: Math.max(0, position),
                behavior: "smooth"
            });
        });
    </script>
</body>
